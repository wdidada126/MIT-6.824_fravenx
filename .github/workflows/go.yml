# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.x'

    # 库包编译检查（mrapps/main 下均为独立小程序，由 test-mr.sh 逐个编译，不能 ./...）
    - name: Build
      working-directory: src
      run: go build -v ./mr ./raft ./kvraft ./shardctrler ./shardkv ./labgob ./labrpc ./porcupine ./models

    - name: dev
      run: |
        sed -i 's/\r$//' src/main/test-mr-many.sh
        cd src/main
        ./test-mr-many.sh
